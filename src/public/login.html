<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập Quản Trị Hàng Đợi Redis | Đồ Án NoSQL</title>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --redis-red: #dc382d;
      --redis-dark: #12151c;
      --redis-card: rgba(26, 32, 44, 0.85);
      --redis-border: rgba(220, 56, 45, 0.25);
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 50% 20%, #202736 0%, #0d1117 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
      margin: 0;
      padding: 1.5rem;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
    }
    .login-card {
      background: var(--redis-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--redis-border);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 25px rgba(220, 56, 45, 0.15);
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .brand-logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #dc382d 0%, #8b110b 100%);
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      box-shadow: 0 8px 20px rgba(220, 56, 45, 0.35);
      margin: 0 auto 1.25rem auto;
    }
    .form-control {
      background-color: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: #f8fafc;
      border-radius: 0.65rem;
      padding: 0.75rem 1rem;
      transition: all 0.2s ease;
    }
    .form-control:focus {
      background-color: rgba(15, 23, 42, 0.95);
      border-color: #dc382d;
      color: #fff;
      box-shadow: 0 0 0 3px rgba(220, 56, 45, 0.25);
    }
    .input-group-text {
      background-color: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: #94a3b8;
      border-radius: 0.65rem 0 0 0.65rem;
    }
    .btn-login {
      background: linear-gradient(135deg, #dc382d 0%, #b91c1c 100%);
      border: none;
      color: white;
      font-weight: 600;
      padding: 0.8rem 1.25rem;
      border-radius: 0.65rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(220, 56, 45, 0.4);
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #ef4444 0%, #dc382d 100%);
      color: white;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(220, 56, 45, 0.5);
    }
    .quick-fill-badge {
      background: rgba(220, 56, 45, 0.15);
      border: 1px dashed rgba(220, 56, 45, 0.4);
      color: #fca5a5;
      font-size: 0.825rem;
      border-radius: 0.5rem;
      padding: 0.5rem 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .quick-fill-badge:hover {
      background: rgba(220, 56, 45, 0.25);
      color: #fff;
      border-color: #dc382d;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="text-center mb-4">
        <div class="brand-logo">⚡</div>
        <h4 class="fw-bold mb-1 text-white">Quản Trị Hàng Đợi Redis</h4>
        <p class="text-secondary small mb-0">Đồ án NoSQL - Đại học Công Thương TP.HCM (HUIT)</p>
      </div>

      <!-- Alert Box -->
      <div id="alertBox" class="alert alert-danger py-2 px-3 small d-none" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-1"></i>
        <span id="alertMessage">Sai tài khoản hoặc mật khẩu</span>
      </div>

      <form id="loginForm" autocomplete="off">
        <div class="mb-3">
          <label class="form-label small fw-semibold text-light mb-1">Tên đăng nhập</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person-circle"></i></span>
            <input type="text" id="username" class="form-control" placeholder="admin" value="admin" required autofocus>
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="form-label small fw-semibold text-light mb-0">Mật khẩu quản trị</label>
          </div>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-shield-lock-fill"></i></span>
            <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu..." required>
            <button class="btn btn-outline-secondary text-secondary" type="button" id="togglePasswordBtn" style="border-color: rgba(148, 163, 184, 0.2);">
              <i class="bi bi-eye" id="toggleIcon"></i>
            </button>
          </div>
        </div>

        <!-- Quick Autofill Box -->
        <div class="mb-4">
          <div class="quick-fill-badge d-flex align-items-center justify-content-between" id="quickFillBtn" title="Bấm để tự động điền tài khoản mẫu">
            <span><i class="bi bi-lightning-charge-fill text-warning me-1"></i> Điền nhanh mặc định:</span>
            <code class="text-warning fw-bold">admin / admin123</code>
          </div>
        </div>

        <button type="submit" class="btn btn-login w-100 d-flex align-items-center justify-content-center gap-2" id="submitBtn">
          <i class="bi bi-box-arrow-in-right"></i>
          <span>Đăng Nhập Dashboard</span>
        </button>
      </form>

      <div class="text-center mt-4 pt-2 border-top border-secondary border-opacity-25">
        <a href="/" class="text-secondary text-decoration-none small d-inline-flex align-items-center gap-1 hover-light">
          <i class="bi bi-arrow-left"></i> Quay lại Cửa Hàng Mua Hàng
        </a>
      </div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertBox');
    const alertMessage = document.getElementById('alertMessage');
    const quickFillBtn = document.getElementById('quickFillBtn');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const toggleIcon = document.getElementById('toggleIcon');

    // Quick Autofill
    quickFillBtn.addEventListener('click', () => {
      usernameInput.value = 'admin';
      passwordInput.value = 'admin123';
      passwordInput.focus();
    });

    // Toggle Password Visibility
    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      toggleIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
    });

    // Handle Login Submit
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('d-none');

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        showError('Vui lòng điền đầy đủ tên đăng nhập và mật khẩu.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Đang xác thực...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const json = await res.json();

        if (res.ok && json.success) {
          submitBtn.classList.remove('btn-login');
          submitBtn.classList.add('btn-success');
          submitBtn.innerHTML = '<i class="bi bi-check-circle-fill"></i> Thành công! Đang chuyển hướng...';
          
          const params = new URLSearchParams(window.location.search);
          const redirect = params.get('redirect') || json.redirect || '/admin';
          setTimeout(() => {
            window.location.href = redirect;
          }, 400);
        } else {
          showError(json.message || 'Sai tên đăng nhập hoặc mật khẩu.');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Đăng Nhập Dashboard';
          passwordInput.focus();
        }
      } catch (err) {
        showError('Lỗi kết nối máy chủ. Vui lòng kiểm tra lại server.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Đăng Nhập Dashboard';
      }
    });

    function showError(msg) {
      alertMessage.textContent = msg;
      alertBox.classList.remove('d-none');
    }
  </script>
</body>
</html>
