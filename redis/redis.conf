# =====================================================================
# REDIS CONFIGURATION CHO DO AN NOSQL - ORDER QUEUE MANAGEMENT
# =====================================================================

# Mang va cong ket noi
port 6379
bind 127.0.0.1
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Che do chay daemon (chay foreground tren Docker, co the bat daemon tren Linux)
daemonize no
loglevel notice
logfile ""

# Co so du lieu logic
databases 16

# =====================================================================
# LUU TRU BEN VUNG (PERSISTENCE): RDB SNAPSHOT
# =====================================================================
# Chup anh trang thai xuong o dia:
# Sau 900 giay (15 phut) neu co it nhat 1 khoa thay doi
# Sau 300 giay (5 phut) neu co it nhat 10 khoa thay doi
# Sau 60 giay (1 phut) neu co it nhat 100 khoa thay doi
save 900 1
save 300 10
save 60 100

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir ./

# =====================================================================
# LUU TRU BEN VUNG (PERSISTENCE): APPEND ONLY FILE (AOF)
# =====================================================================
# Bat che do AOF de ghi nhat ky tat ca thao tac lam bien doi du lieu
appendonly yes
appendfilename "appendonly.aof"

# Dong bo xuong dia moi giay (can bang giua toc do va an toan du lieu)
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# =====================================================================
# GIOI HAN BO NHO VA THU HOI (MEMORY MANAGEMENT)
# =====================================================================
maxmemory 256mb
maxmemory-policy noeviction
